[project]
name = "esol-solubility"
version = "0.1.0"
description = "CHE1147 Team 9: predicting aqueous solubility (log S) of the ESOL molecules from molecular structure"
requires-python = ">=3.11,<3.12"
# Versions pinned so that the results reproduce (uv.lock fixes every other package too).
# Most are the versions of our proposal (Oct 2026). Changes since then: the proposal used
# Python 3.10 and scipy 1.15.3, but that scipy no longer loads on current macOS, so we use
# Python 3.11 and scipy 1.16.3. shap and ipywidgets were added in the final project.
# xgboost 3.2.0 is newer than the course's pin (below 3.1), see 05_interpretation.ipynb (section 6).
dependencies = [
    "numpy==1.26.4",
    "pandas==2.3.3",
    "scipy==1.16.3",
    "scikit-learn==1.7.2",
    "xgboost==3.2.0",
    "rdkit==2026.3.6",
    "matplotlib==3.10.0",
    "seaborn==0.13.2",
    "ydata-profiling==4.18.4",  # automatic EDA report (as in Tutorial 3)
    "setuptools<82",  # ydata-profiling still imports pkg_resources (same pin as the course repo).
    "ipywidgets==8.1.9",  # progress bars in notebooks (also in the course environment)
    "shap==0.49.1",  # SHAP explanations (Lecture 8)
    "jupyterlab==4.6.6",
    "ipykernel==7.4.0",
    "nbconvert==7.17.2",
]

[tool.uv]
package = false
